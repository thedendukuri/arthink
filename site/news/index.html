<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>prvaaha. — News</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1f10'/%3E%3Cpath d='M2,22 L6,16 L10,20 L14,9 C16,4 18,14 21,10 C24,6 27,13 30,8' fill='none' stroke='%23c9a84c' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Pathway+Gothic+One&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0906;
  --surface:#141109;
  --surface2:rgba(30,25,12,.9);
  --border:rgba(201,168,76,.14);
  --border2:rgba(201,168,76,.35);
  --text:#f5f0e0;
  --text2:rgba(245,240,224,.72);
  --muted:rgba(245,240,224,.45);
  --gold:#c9a84c;
  --accent:#c9a84c;
  --pos:#6ee7a0;
  --neg:#f08a8a;
  --link:#a78bfa;
  --hdr:#0d0d0d;
  --hdr-text:rgba(245,240,224,.88);
  --hdr-muted:rgba(245,240,224,.42);
  --sans:'Pathway Gothic One',sans-serif;
  --mono:'JetBrains Mono',monospace;
  --serif:'Pathway Gothic One',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:'Pathway Gothic One',sans-serif;font-size:13px;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:'Pathway Gothic One',sans-serif;border:none;outline:none}

@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes tsroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes skelPulse{0%,100%{opacity:1}50%{opacity:.2}}

/* ── TICKER BAR ── */
.tbar{background:#0d0d0d;border-bottom:1px solid rgba(201,168,76,.1);height:32px;overflow:hidden;position:relative}
.tbar::before,.tbar::after{content:'';position:absolute;top:0;bottom:0;width:60px;z-index:2;pointer-events:none}
.tbar::before{left:0;background:linear-gradient(to right,#0d0d0d 40%,transparent)}
.tbar::after{right:0;background:linear-gradient(to left,#0d0d0d 40%,transparent)}
.tbar-track{display:flex;align-items:center;height:100%;animation:tsroll 90s linear infinite;width:max-content;will-change:transform}
.tbar-track:hover{animation-play-state:paused}
.tick{display:flex;align-items:center;gap:8px;padding:0 18px;border-right:1px solid rgba(201,168,76,.1);height:100%;cursor:pointer;flex-shrink:0}
.tick:hover{background:rgba(201,168,76,.04)}
.t-sym{font-family:'Pathway Gothic One',sans-serif;font-size:10px;font-weight:700;color:rgba(245,240,224,.6);white-space:nowrap;letter-spacing:.3px}
.t-row{display:flex;align-items:center;gap:4px}
.t-price{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(245,240,224,.5);white-space:nowrap}
.t-pct{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;white-space:nowrap}
.t-pct.pos{color:#6ee7a0}.t-pct.neg{color:#f08a8a}
.tick-left{display:flex;flex-direction:column;gap:1px}
.tick-spark{display:flex;align-items:center}

/* ── HEADER ── */
.hdr{background:#0d0d0d;border-bottom:3px solid #138808;height:58px;display:flex;align-items:center;padding:0 24px;gap:0;position:sticky;top:0;z-index:600}
.logo{display:flex;align-items:center;gap:10px;padding-right:20px;border-right:1px solid rgba(201,168,76,.15);flex-shrink:0;cursor:pointer}
.logo-flag{width:26px;height:26px;border-radius:3px;overflow:hidden;display:flex;flex-direction:column;flex-shrink:0}
.lf1{flex:1;background:#FF9933}
.lf2{flex:1;background:#fff;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:900;color:#000080}
.lf3{flex:1;background:#138808}
.nav{display:flex;flex:1;padding-left:10px;overflow:hidden}
.nav a{color:rgba(245,240,224,.75);font-size:13px;font-family:'Pathway Gothic One',sans-serif;letter-spacing:.02em;padding:0 14px;height:58px;display:flex;align-items:center;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-3px;transition:color .15s;cursor:pointer;text-decoration:none}
.nav a:hover{color:var(--hdr-text)}
.nav a.active{color:var(--gold);border-bottom-color:var(--gold)}
.nav a.alpha{color:#fff;font-weight:700;text-shadow:0 0 8px rgba(255,255,255,.5)}

/* Search box */
.search-box{display:flex;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(201,168,76,.18);height:30px;padding:0 10px;gap:8px;width:200px;position:relative}
.search-box input{background:none;border:none;outline:none;color:#f5f0e0;font-size:12px;font-family:'Pathway Gothic One',sans-serif;width:100%}
.search-box input::placeholder{color:rgba(245,240,224,.4)}
.search-drop{position:absolute;top:100%;left:0;right:0;background:#141109;border:1px solid rgba(201,168,76,.25);border-top:none;z-index:700;box-shadow:0 12px 40px rgba(0,0,0,.8);display:none;max-height:280px;overflow-y:auto}
.search-drop.open{display:block}
.sd-cat{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.25px;color:var(--muted);padding:10px 14px 4px;border-top:1px solid var(--border)}
.sd-cat:first-child{border-top:none}
.sd-row{display:flex;align-items:center;padding:8px 14px;gap:10px;cursor:pointer;transition:background .1s}
.sd-row:hover{background:rgba(201,168,76,.06)}
.sd-badge{font-size:9px;font-weight:700;padding:2px 6px;flex-shrink:0;text-transform:uppercase;letter-spacing:.3px}
.sd-sym{font-family:var(--mono);font-size:12px;font-weight:700;min-width:68px;flex-shrink:0;color:var(--text)}
.sd-name{font-size:12px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd-pct{font-family:var(--mono);font-size:12px;font-weight:700;flex-shrink:0}
.sd-pct.pos{color:var(--pos)}.sd-pct.neg{color:var(--neg)}
.sd-empty{padding:20px;text-align:center;color:var(--muted);font-size:13px}
.search-wrap{position:relative}

.signin-btn{background:transparent;color:#c9a84c;border:1px solid rgba(201,168,76,.4);padding:5px 14px;font-size:11px;letter-spacing:.2px;text-transform:uppercase;white-space:nowrap;font-family:'Pathway Gothic One',sans-serif;cursor:pointer;transition:all .15s}
.signin-btn:hover{background:rgba(201,168,76,.1);border-color:var(--gold)}

/* ── THEME TOGGLE ── */
.theme-toggle{position:relative;display:flex;align-items:center}
.theme-toggle-btn{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.05);border:1px solid rgba(201,168,76,.22);height:30px;padding:0 10px;cursor:pointer;font-family:'Pathway Gothic One',sans-serif;font-size:10px;color:rgba(245,240,224,.6);letter-spacing:.08em;white-space:nowrap;transition:all .15s}
.theme-toggle-btn:hover{border-color:rgba(201,168,76,.5);color:#f5f0e0}
.theme-toggle-btn svg{flex-shrink:0}
.theme-menu{position:absolute;top:calc(100% + 6px);right:0;background:#0d0d0d;border:1px solid rgba(201,168,76,.22);min-width:140px;z-index:700;display:none;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.8)}
.theme-menu.open{display:flex}
.theme-opt{display:flex;align-items:center;gap:9px;padding:8px 14px;font-family:'Pathway Gothic One',sans-serif;font-size:12px;color:rgba(245,240,224,.65);cursor:pointer;letter-spacing:.04em;transition:background .12s,color .12s;border:none;background:none;width:100%;text-align:left}
.theme-opt:hover{background:rgba(201,168,76,.07);color:#f5f0e0}
.theme-opt.active{color:var(--gold)}
.theme-opt svg{flex-shrink:0;opacity:.7}

/* ── STATUS BAR ── */
.status-bar{background:#0d0d0d;border-bottom:1px solid rgba(201,168,76,.08);padding:3px 24px;display:flex;align-items:center;gap:12px;font-size:9px;color:rgba(245,240,224,.4);letter-spacing:.3px;font-family:'JetBrains Mono',monospace;height:22px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--pos);animation:blink 1.5s ease-in-out infinite;display:inline-block}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   NEWS PAGE — Editorial / Newspaper
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.news-page{max-width:1200px;margin:0 auto;padding:0 24px 60px}

/* Date bar */
.news-datebar{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.news-date-text{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.2px;text-transform:uppercase}
.news-live-badge{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;color:var(--pos);letter-spacing:.5px;text-transform:uppercase}

/* Region tabs */
.news-region-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:0}
.nrt{padding:10px 18px;border:none;background:none;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.15px;text-transform:uppercase;cursor:pointer;font-family:var(--sans);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;display:flex;align-items:center;gap:6px}
.nrt:hover{color:var(--text)}.nrt.on{color:var(--text);border-bottom-color:var(--accent)}

/* nrt-badge */
.nrt-badge{background:var(--surface2);color:var(--muted);font-size:9px;font-weight:700;padding:1px 6px;font-family:var(--mono);min-width:20px;text-align:center}
.nrt.on .nrt-badge{background:rgba(201,168,76,.12);color:var(--accent)}

/* Category strip */
.news-cat-strip{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);scrollbar-width:none}
.news-cat-strip::-webkit-scrollbar{display:none}
.ncs-btn{padding:8px 16px;border:none;background:none;color:var(--muted);font-size:10px;font-weight:500;letter-spacing:.2px;text-transform:uppercase;cursor:pointer;font-family:var(--sans);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;white-space:nowrap;border-right:1px solid var(--border)}
.ncs-btn:last-child{border-right:none}
.ncs-btn:hover{color:var(--text)}.ncs-btn.on{color:var(--accent);border-bottom-color:var(--accent)}

/* Source pills */
.news-src-strip{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--border)}
.ns-pill{background:none;border:1px solid var(--border);color:var(--muted);padding:3px 10px;font-size:10px;font-weight:600;letter-spacing:.3px;cursor:pointer;transition:all .15s;font-family:var(--sans)}
.ns-pill:hover{border-color:var(--border2);color:var(--text)}
.ns-pill.on{border-color:var(--accent);color:var(--accent);background:rgba(201,168,76,.07)}

/* ── MAIN LAYOUT: hero left + right column ── */
.news-layout{display:grid;grid-template-columns:1fr 320px;gap:0;border-bottom:2px solid var(--border);min-height:340px}
@media(max-width:900px){.news-layout{grid-template-columns:1fr}}
.news-main{border-right:1px solid var(--border);padding:20px 24px 20px 0}
.news-col{padding:20px 0 20px 24px;display:flex;flex-direction:column;gap:0}

/* Hero article */
.np-hero{cursor:pointer;margin-bottom:4px}
.np-hero:hover .np-hero-title{color:var(--accent)}
.np-hero-img{height:300px;overflow:hidden;background:var(--surface2);position:relative;margin-bottom:14px}
.np-hero-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.np-hero:hover .np-hero-img img{transform:scale(1.02)}
.np-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.np-src{font-size:10px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.2px}
.np-tag{font-size:9px;font-weight:700;padding:2px 6px;text-transform:uppercase;letter-spacing:.4px;background:var(--surface2);color:var(--muted)}
.np-region-badge{font-size:9px;font-weight:700;padding:2px 7px;text-transform:uppercase;letter-spacing:.4px}
.np-region-badge.india{background:rgba(255,153,51,.12);color:var(--accent)}
.np-region-badge.world{background:rgba(167,139,250,.1);color:var(--link)}
.np-time{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto}
.np-hero-title{font-family:var(--sans);font-size:26px;font-weight:700;line-height:1.25;color:var(--text);transition:color .15s;margin-bottom:10px;letter-spacing:-.3px}
.np-hero-excerpt{font-size:13px;color:var(--text2);line-height:1.65}

/* Right column article */
.np-colart{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;position:relative}
.np-colart:last-child{border-bottom:none}
.np-colart:hover .np-colart-title{color:var(--accent)}
.np-colart-img{width:76px;height:56px;flex-shrink:0;overflow:hidden;background:var(--surface2)}
.np-colart-img img{width:100%;height:100%;object-fit:cover;display:block}
.np-colart-body{flex:1;min-width:0}
.np-colart-title{font-family:var(--sans);font-size:13px;font-weight:700;line-height:1.4;color:var(--text);transition:color .15s;margin-bottom:4px}
.np-colart-time{font-family:var(--mono);font-size:9px;color:var(--muted)}

/* ── Pin button ── */
.ng4-card{position:relative}
.pin-btn{position:absolute;top:8px;right:8px;background:rgba(13,13,13,.72);color:#fff;border:none;
  width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  font-size:11px;cursor:pointer;opacity:0;transition:opacity .15s;z-index:2;
  backdrop-filter:blur(4px);border-radius:2px}
.np-colart .pin-btn{top:50%;transform:translateY(-50%);right:0}
.ng4-card:hover .pin-btn,.np-colart:hover .pin-btn{opacity:1}
.pin-btn:hover{background:rgba(201,168,76,.85);color:#000}

/* ── Pinned headline badge ── */
.hero-pin-badge{display:inline-flex;align-items:center;gap:7px;background:var(--accent);
  color:#000;font-size:9px;font-weight:700;padding:3px 8px;letter-spacing:.12px;
  text-transform:uppercase;margin-bottom:10px;cursor:default}
.hero-pin-badge .unpin{cursor:pointer;opacity:.7;text-decoration:underline;
  font-size:9px;transition:opacity .15s}
.hero-pin-badge .unpin:hover{opacity:1}

/* 4-col grid below */
.news-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);margin-top:0}
@media(max-width:900px){.news-grid4{grid-template-columns:1fr 1fr}}
.ng4-card{background:var(--bg);padding:16px;cursor:pointer}
.ng4-card:hover .ng4-title{color:var(--accent)}
.ng4-img{height:110px;overflow:hidden;background:var(--surface2);margin-bottom:10px}
.ng4-img img{width:100%;height:100%;object-fit:cover;display:block}
.ng4-meta{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.ng4-src{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.ng4-tag{font-size:8px;font-weight:700;padding:1px 5px;text-transform:uppercase;background:var(--surface2);color:var(--muted)}
.ng4-title{font-family:var(--sans);font-size:13px;font-weight:700;line-height:1.4;color:var(--text);transition:color .15s}
.ng4-time{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:6px}

/* Archives */
.news-archives{margin-top:40px;padding-top:0}
.news-archives-label{font-family:var(--sans);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.35px;color:var(--muted);margin-bottom:0;display:flex;align-items:center;gap:12px;padding:12px 0;border-top:2px solid var(--border)}
.news-archives-label::after{content:'';flex:1;height:1px;background:var(--border)}
.arch-row{display:flex;align-items:flex-start;gap:14px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
.arch-row:last-child{border-bottom:none}
.arch-row:hover .arch-title{color:var(--accent)}
.arch-time{font-family:var(--mono);font-size:10px;color:var(--muted);flex-shrink:0;width:48px;padding-top:2px}
.arch-body{flex:1;min-width:0}
.arch-src{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.arch-title{font-family:var(--sans);font-size:13px;font-weight:500;line-height:1.42;color:var(--text);transition:color .15s}

/* Skeleton */
.skel{background:var(--surface2);animation:skelPulse 1.6s ease-in-out infinite}

/* ── Ticker chips on news cards ── */
.nc-tickers{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;min-height:0}
.nc-tick{font-family:var(--mono);font-size:9px;font-weight:700;padding:2px 6px;border-radius:2px;white-space:nowrap;cursor:pointer;transition:opacity .15s;text-decoration:none;border:1px solid transparent}
.nc-tick:hover{opacity:.72}
.nc-tick.up{background:rgba(110,231,160,.1);color:var(--pos);border-color:rgba(110,231,160,.25)}
.nc-tick.dn{background:rgba(240,138,138,.1);color:var(--neg);border-color:rgba(240,138,138,.25)}
.nc-tick.flat{background:var(--surface2);color:var(--muted);border-color:var(--border)}

/* ═══════════════════════════════════════════
   DAY MODE OVERRIDES — body.theme-light
   Chrome (header, ticker, status bar) stays dark always.
   News content area goes light.
═══════════════════════════════════════════ */
body.theme-light{background:#f5f2ec}
body.theme-light .news-page{background:#f5f2ec}
body.theme-light .news-datebar{border-bottom-color:rgba(0,0,0,.1)}
body.theme-light .nrt{color:rgba(30,20,5,.5)}
body.theme-light .nrt:hover{color:rgba(30,20,5,.85)}
body.theme-light .nrt.on{color:rgba(30,20,5,.9);border-bottom-color:var(--gold)}
body.theme-light .nrt-badge{background:rgba(0,0,0,.07);color:rgba(30,20,5,.45)}
body.theme-light .nrt.on .nrt-badge{background:rgba(201,168,76,.15);color:var(--gold)}
body.theme-light .ncs-btn{color:rgba(30,20,5,.45)}
body.theme-light .ncs-btn:hover{color:rgba(30,20,5,.85)}
body.theme-light .ncs-btn.on{color:var(--gold);border-bottom-color:var(--gold)}
body.theme-light .ns-pill{border-color:rgba(0,0,0,.14);color:rgba(30,20,5,.5)}
body.theme-light .ns-pill:hover{border-color:rgba(0,0,0,.3);color:rgba(30,20,5,.85)}
body.theme-light .ns-pill.on{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,.08)}
body.theme-light .np-hero-title{color:#1a1208}
body.theme-light .ng4-title{color:#1a1208}
body.theme-light .np-colart-title{color:#1a1208}
body.theme-light .arch-title{color:#1a1208}
body.theme-light .ng4-img{background:rgba(0,0,0,.08)}
body.theme-light .np-colart-img{background:rgba(0,0,0,.08)}
body.theme-light .np-tag{background:rgba(0,0,0,.07);color:rgba(30,20,5,.5)}
body.theme-light .ng4-tag{background:rgba(0,0,0,.07);color:rgba(30,20,5,.5)}
body.theme-light .news-grid4{background:rgba(0,0,0,.08)}
body.theme-light .ng4-card{background:#f5f2ec}
body.theme-light .news-archives-label{border-top-color:rgba(0,0,0,.1);color:rgba(30,20,5,.45)}
body.theme-light .news-archives-label::after{background:rgba(0,0,0,.1)}
body.theme-light .arch-row{border-bottom-color:rgba(0,0,0,.08)}
body.theme-light .pin-btn{background:rgba(245,242,236,.85);color:#1a1208;border:1px solid rgba(0,0,0,.15)}
body.theme-light .pin-btn:hover{background:var(--gold);color:#000;border-color:var(--gold)}
body.theme-light .np-colart{border-bottom-color:rgba(0,0,0,.08)}
body.theme-light .news-layout{border-bottom-color:rgba(0,0,0,.1)}
body.theme-light .news-main{border-right-color:rgba(0,0,0,.08)}
body.theme-light .news-region-tabs{border-bottom-color:rgba(0,0,0,.1)}
body.theme-light .news-cat-strip{border-bottom-color:rgba(0,0,0,.1)}
body.theme-light .ncs-btn{border-right-color:rgba(0,0,0,.08)}
body.theme-light .news-src-strip{border-bottom-color:rgba(0,0,0,.08)}
body.theme-light .news-datebar{border-bottom-color:rgba(0,0,0,.1)}
</style>
</head>
<body>

<!-- ── HEADER ── -->
<header class="hdr">
  <div class="logo" onclick="location.href='../prthvi-home-page.html'" style="cursor:pointer">

const SD={},ID_DATA={};
let histI={},histS={};

const fmt=(n,d=2)=>(+n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=v=>v>=0?'+':'';
const clr=v=>v>=0?'var(--pos)':'var(--neg)';
const rnd=(a,b)=>Math.random()*(b-a)+a;
const fmtVol=v=>v>=1e7?(v/1e7).toFixed(1)+'Cr':v>=1e5?(v/1e5).toFixed(1)+'L':(v/1e3).toFixed(0)+'K';

function genHist(base,positive,pts=60){
  const v=[0];const drift=positive?.03:-.03;
  for(let i=1;i<pts;i++) v.push(v[i-1]+drift+(Math.random()-.5)*1.8);
  const mn=Math.min(...v),mx=Math.max(...v),range=mx-mn||1;
  return v.map(x=>base*(1+(x-mn)/range*0.025-0.0125));
}

function initData(){
  ALL_INDICES.forEach(i=>{
    ID_DATA[i.sym]={price:i.base,chg:0,pct:0};
    histI[i.sym]=genHist(i.base,true);
  });
  STOCKS.forEach(s=>{
    const initPct=(Math.random()-0.5)*4;
    const initPrice=s.base*(1+initPct/100);
    SD[s.sym]={price:initPrice,chg:initPrice-s.base,pct:initPct,vol:Math.floor(3e6+Math.random()*8e6)};
    histS[s.sym]=genHist(s.base,true);
  });
}

// ══════════════════════════════════════════════
// SPARKLINE
// ══════════════════════════════════════════════
function spark(hist,w=52,h=22,sw=1.3){
  if(!hist||hist.length<2) return`<svg width="${w}" height="${h}"></svg>`;
  const mn=Math.min(...hist),mx=Math.max(...hist),range=mx-mn||1;
  const pos=hist[hist.length-1]>=hist[0];
  const col=pos?'#22c55e':'#ef4444';
  const pts=hist.map((v,i)=>`${(i/(hist.length-1))*w},${h-2-((v-mn)/range)*(h-4)}`).join(' ');
  const lx=w,ly=h-2-((hist[hist.length-1]-mn)/range)*(h-4);
  return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" overflow="visible">
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lx}" cy="${ly}" r="2" fill="${col}"/>
  </svg>`;
}

// ══════════════════════════════════════════════
// TICKER — build once, update in-place
// ══════════════════════════════════════════════
function buildTicker(){
  const items=[
    ...REGIONS_DEF[0].indices.map(i=>({id:i.s,sym:i.sym,label:i.s,prefix:'',hist:histI[i.sym]})),
    ...STOCKS.slice(0,9).map(s=>({id:s.s,sym:s.sym,label:s.s,prefix:'₹',hist:histS[s.sym]})),
  ];
  const html=items.map(it=>{
    const d=it.prefix?SD[it.sym]:ID_DATA[it.sym];
    const pct=d?.pct||0;const price=d?.price||0;
    return`<div class="tick">
      <div class="tick-left">
        <span class="t-sym">${it.label}</span>
        <div class="t-row">
          <span class="t-price" data-tp="${it.id}">${it.prefix}${fmt(price,it.prefix?2:0)}</span>
          <span class="t-pct ${pct>=0?'pos':'neg'}" data-tc="${it.id}">${sgn(pct)}${fmt(pct)}%</span>
        </div>
      </div>
      <div class="tick-spark" data-ts="${it.id}">${spark(it.hist,52,22)}</div>
    </div>`;
  }).join('');
  document.getElementById('tbarTrack').innerHTML=html+html;
}

function tickData(){
  ALL_INDICES.forEach(i=>{
    const cur=ID_DATA[i.sym];const d=cur.price*(Math.random()-.495)*.004;const p=cur.price+d;
    ID_DATA[i.sym]={price:p,chg:p-i.base,pct:((p-i.base)/i.base)*100};
    histI[i.sym].push(p);if(histI[i.sym].length>80)histI[i.sym].shift();
  });
  STOCKS.forEach(s=>{
    const cur=SD[s.sym];const d=cur.price*(Math.random()-.495)*.005;const p=cur.price+d;
    SD[s.sym]={price:p,chg:p-s.base,pct:((p-s.base)/s.base)*100,vol:cur.vol+Math.floor(rnd(1e4,8e4))};
    histS[s.sym].push(p);if(histS[s.sym].length>80)histS[s.sym].shift();
  });
}

function refreshTicker(){
  tickData();
  const items=[
    ...REGIONS_DEF[0].indices.map(i=>({id:i.s,sym:i.sym,prefix:'',hist:histI[i.sym]})),
    ...STOCKS.slice(0,9).map(s=>({id:s.s,sym:s.sym,prefix:'₹',hist:histS[s.sym]})),
  ];
  items.forEach(it=>{
    const d=it.prefix?SD[it.sym]:ID_DATA[it.sym];
    if(!d) return;
    const pct=d.pct||0;
    const price=d.price||0;
    document.querySelectorAll(`[data-tp="${it.id}"]`).forEach(el=>el.textContent=it.prefix+fmt(price,it.prefix?2:0));
    document.querySelectorAll(`[data-tc="${it.id}"]`).forEach(el=>{
      el.textContent=sgn(pct)+fmt(pct)+'%';
      el.className='t-pct '+(pct>=0?'pos':'neg');
    });
    document.querySelectorAll(`[data-ts="${it.id}"]`).forEach(el=>el.innerHTML=spark(it.hist,52,22));
  });
}

function extractTickers(title,summary){
  const text=((title||'')+' '+(summary||'')).replace(/&amp;/g,'&').replace(/&lt;/g,'<');
  const found=[];
  const seen=new Set();
  for(const [re,info] of _TICKER_LOOKUP){
    if(found.length>=2) break;
    if(re.test(text)&&!seen.has(info.s)){found.push(info);seen.add(info.s);}
  }
  return found;
}

async function refreshNewsTickers(){
  const cards=document.querySelectorAll('[data-tickers]');
  if(!cards.length) return;
  const symSet=new Set();
  cards.forEach(c=>c.dataset.tickers.split(',').filter(Boolean).forEach(s=>symSet.add(s)));
  if(!symSet.size) return;
  if(!IS_SERVED) return; // don't fetch from local file
  try{
    const resp=await fetch(`/api/quote?syms=${encodeURIComponent([...symSet].join(','))}`);
    const data=await resp.json();
    const qmap={};
    (data?.quoteResponse?.result||[]).forEach(q=>{
      qmap[q.symbol]={price:q.regularMarketPrice,pct:q.regularMarketChangePercent};
    });
    cards.forEach(c=>{
      const syms=c.dataset.tickers.split(',').filter(Boolean);
      const el=c.querySelector('.nc-tickers');
      if(!el) return;
      const chips=syms.map(sym=>{
        const q=qmap[sym];
        if(!q||q.price==null) return '';
        const pct=q.pct??0;
        const cls=pct>0.1?'up':pct<-0.1?'dn':'flat';
        const sign=pct>=0?'▲':'▼';
        const isINR=sym.endsWith('.NS')||sym.endsWith('.BO');
        const isFX=sym.includes('=F');
        const p=isINR?'₹':isFX||sym.startsWith('^')?'':'$';
        const display=sym.replace(/\.(NS|BO)$/,'').replace(/^[^]/,'').replace(/%26/g,'&');
        const priceStr=p+(q.price>=1000?fmt(q.price):q.price>=100?q.price.toFixed(1):q.price.toFixed(2));
        return`<span class="nc-tick ${cls}" title="${display}">${display} ${priceStr} ${sign}${Math.abs(pct).toFixed(1)}%</span>`;
      }).filter(Boolean).join('');
      el.innerHTML=chips;
    });
  }catch(e){}
}

function _decodeHtml(s){
  if(!s) return '';
  let r=s.replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g,'$1');
  r=r.replace(/<[^>]+>/g,' ');
  r=r.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
      .replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'");
  return r.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
}

function _guessCategory(title, defaultCat){
  if(!title) return defaultCat;
  const t=title.toLowerCase();
  if(/cricket|ipl|bcci|rcb|csk|\bmi\b|kkr|srh|\brr\b|\bdc\b|ashwin|jadeja|kohli|rohit|dhoni|virat|bumrah|icc|test match|t20|one.?day/.test(t)) return 'SPORTS';
  if(/chess|carlsen|gukesh|pragg|arjun erigaisi|fide|norway chess/.test(t)) return 'SPORTS';
  if(/\bfilm\b|movie|actor|actress|bollywood|ott\b|netflix|amazon prime|web series/.test(t)) return 'ENTERTAINMENT';
  if(/missile|military|army|navy|airstrike|ceasefire|war\b|troops|soldier/.test(t)) return 'WORLD';
  if(/election|parliament|\bbjp\b|\bcongress\b|lok sabha|rajya sabha|cm\b|chief minister/.test(t)) return 'POLITICS';
  return defaultCat;
}

function _mapSbArticle(r){
  const baseCat=_SBCAT[r.source_name]||'MARKETS';
  const title=_decodeHtml(r.title);
  return{
    id:        r.id,
    title,
    link:      r.canonical_url,
    source:    r.source_name,
    category:  _guessCategory(title, baseCat),
    region:    r.region||'india',
    pubDate:   r.published_at||r.created_at||null,
    excerpt:   _decodeHtml(r.summary),
    thumbnail: r.image_url||null,
  };
}

async function fetchSupabaseNews(limit=400){
  if(!_sb) return [];
  try{
    const FINANCE_SOURCES=['Economic Times Stocks','Economic Times Economy','Economic Times Industry',
      'Economic Times Wealth','Economic Times Markets','Economic Times Tech','Economic Times Top Stories',
      'The Hindu Business','Financial Express',
      'Google News India Business','Google News India Economy','Google News India Startups',
      'Moneycontrol Latest','Moneycontrol Markets',
      'NDTV Profit','Livemint Markets','Livemint Money',
      'BBC Business','Business Standard Markets','Business Standard Economy'];
    const result=await Promise.race([
      _sb.from('articles')
        .select('id,canonical_url,title,summary,source_name,published_at,created_at,region,image_url')
        .in('source_name', FINANCE_SOURCES)
        .order('published_at',{ascending:false,nullsFirst:false})
        .limit(limit),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('sb timeout')),8000)),
    ]);
    const{data,error}=result;
    if(error||!data?.length) return[];
    return data.map(_mapSbArticle).filter(a=>a.title&&a.title.trim().length>3);
  }catch(e){return[];}
}

async function fetchHomeNews(){
  if(_newsArticles.length) return _newsArticles;
  const sbNews=await fetchSupabaseNews(400);
  if(sbNews.length){
    _newsLastFetch=Date.now();
    const existingIds=new Set(sbNews.map(a=>String(a.id)));
    const manual=MANUAL_NEWS.filter(a=>!existingIds.has(String(a.id)));
    _newsArticles=[...manual,...sbNews];
    return _newsArticles;
  }
  if(IS_SERVED){
    try{
      const resp=await fetch('/api/news',{signal:AbortSignal.timeout(12000)});
      if(!resp.ok) throw new Error(resp.status);
      const data=await resp.json();
      _newsArticles=data.articles||[];
      _newsArchives=data.archives||[];
      _newsLastFetch=Date.now();
    }catch(e){ _newsArticles=[]; }
    const existingIds=new Set(_newsArticles.map(a=>String(a.id)));
    const manual=MANUAL_NEWS.filter(a=>!existingIds.has(String(a.id)));
    _newsArticles=[...manual,..._newsArticles];
  }
  return _newsArticles;
}

// ── Editorial scoring ───────────────────────────────────────
const _TIER1 = new Set([
  'Reuters Business News','AP Business',
  'Business Standard Markets','Business Standard Economy',
  'Financial Express','NDTV Profit',
  'Moneycontrol Markets','Economic Times Economy',
]);
const _TIER2 = new Set([
  'Economic Times Markets','Economic Times Stocks',
  'Economic Times Wealth','Economic Times Industry',
  'Economic Times Top Stories',
  'Livemint Markets','Livemint Money',
]);

function _tierWeight(source){
  if(_TIER1.has(source)) return 1.0;
  if(_TIER2.has(source)) return 0.6;
  return 0.3;
}

function _recencyScore(pubDate){
  if(!pubDate) return 0;
  const ageMinutes=(Date.now()-new Date(pubDate))/60000;
  const halfLifeMinutes=90;
  return Math.pow(0.5, ageMinutes/halfLifeMinutes);
}

function _articleScore(a){
  return _tierWeight(a.source) * _recencyScore(a.pubDate);
}

function _sortByScore(articles){
  return [...articles].sort((a,b)=>_articleScore(b)-_articleScore(a));
}

function relTime(iso){
  const s=(Date.now()-new Date(iso))/1000;
  if(s<60)   return 'Just now';
  if(s<3600)  return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function absTime(iso){
  const d=new Date(iso);
  return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function renderNewsPage(){
  const el=document.getElementById('news-all');
  const now=Date.now();
  updateDateBar();
  if(_newsArticles.length && now-_newsLastFetch < NEWS_TTL){
    buildNewsSrcPills(_newsArticles);
    updateRegionCounts();
    renderNewsGrid();
    return;
  }
  el.innerHTML=newsSkeletonHTML();
  _newsArticles=[];
  await fetchHomeNews();
  if(!_newsArticles.length){
    const timeToMs={'Just now':0,'4 min ago':4,'19 min ago':19,'36 min ago':36,
      '1 hr ago':60,'1.5 hr ago':90,'2 hr ago':120,'3 hr ago':180,'4 hr ago':240};
    _newsArticles=NEWS.map((n,i)=>({
      id:i, title:n.h, link:'#', source:n.src,
      pubDate:new Date(Date.now()-(timeToMs[n.time]??i*60)*60000).toISOString(),
      excerpt:n.x||'', thumbnail:`https://picsum.photos/seed/${n.seed}/400/220`,
      category:n.tag, region:'india',
    }));
    _newsArchives=[];
    _newsLastFetch=now;
  }
  buildNewsSrcPills(_newsArticles);
  updateRegionCounts();
  renderNewsGrid();
}

// SEARCH
// ══════════════════════════════════════════════
function buildSearchIndex(){
  const idx=[];
  ALL_INDICES.forEach(i=>{
    idx.push({type:'Index',badge:'rgba(167,139,250,.18)',badgeC:'var(--link)',
      sym:i.s,name:i.n,extra:i.regionEmoji+' '+i.regionName,sym2:i.sym,region:i.region});
  });
  STOCKS.forEach(s=>{
    idx.push({type:'Stock',badge:'rgba(255,153,51,.18)',badgeC:'var(--accent)',
      sym:s.s,name:s.n,extra:s.sect,sym2:s.sym});
  });
  return idx;
}
let _searchIdx=null;

function runSearch(q){
  if(!_searchIdx) _searchIdx=buildSearchIndex();
  const drop=document.getElementById('searchDrop');
  q=q.trim().toLowerCase();
  if(!q){drop.classList.remove('open');drop.innerHTML='';return;}
  const results=_searchIdx.filter(r=>
    r.sym.toLowerCase().includes(q)||
    r.name.toLowerCase().includes(q)||
    (r.extra||'').toLowerCase().includes(q)
  ).slice(0,12);
  if(!results.length){
    drop.innerHTML=`<div class="sd-empty">No results for "<b>${q}</b>"</div>`;
    drop.classList.add('open');return;
  }
  const groups={};
  results.forEach(r=>{if(!groups[r.type])groups[r.type]=[];groups[r.type].push(r);});
  let html='';
  Object.entries(groups).forEach(([type,items])=>{
    html+=`<div class="sd-cat">${type}</div>`;
    items.forEach(r=>{
      const d=r.sym2?ID_DATA[r.sym2]||SD[r.sym2]:null;
      const pct=d?.pct;
      html+=`<div class="sd-row">
        <span class="sd-badge" style="background:${r.badge};color:${r.badgeC}">${r.type}</span>
        <span class="sd-sym">${r.sym}</span>
        <span class="sd-name">${r.name}<span style="color:var(--muted);font-size:10px;margin-left:5px">${r.extra||''}</span></span>
        ${pct!=null?`<span class="sd-pct ${pct>=0?'pos':'neg'}">${sgn(pct)}${fmt(Math.abs(pct))}%</span>`:''}
      </div>`;
    });
  });
  drop.innerHTML=html;
  drop.classList.add('open');
}

function closeSearch(){
  const drop=document.getElementById('searchDrop');
  drop.classList.remove('open');
}

// THEME
// ══════════════════════════════════════════════
const MOON_SVG = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
const SUN_SVG  = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
const SYS_SVG  = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>`;

let _themeMode = localStorage.getItem('prvaaha-combo-theme') || 'dark';

function applyTheme(mode){
  const prefersDark = window.matchMedia('(prefers-color-scheme:dark)').matches;
  const isDark = mode === 'dark' || (mode === 'system' && prefersDark);
  const root = document.documentElement;
  if(isDark){
    document.body.classList.remove('theme-light');
    root.style.setProperty('--bg','#0a0906');
    root.style.setProperty('--surface','#141109');
    root.style.setProperty('--surface2','rgba(30,25,12,.9)');
    root.style.setProperty('--border','rgba(201,168,76,.14)');
    root.style.setProperty('--border2','rgba(201,168,76,.35)');
    root.style.setProperty('--text','#f5f0e0');
    root.style.setProperty('--text2','rgba(245,240,224,.72)');
    root.style.setProperty('--muted','rgba(245,240,224,.45)');
    root.style.setProperty('--pos','#6ee7a0');
    root.style.setProperty('--neg','#f08a8a');
  } else {
    document.body.classList.add('theme-light');
    root.style.setProperty('--bg','#f5f2ec');
    root.style.setProperty('--surface','#ffffff');
    root.style.setProperty('--surface2','rgba(0,0,0,.05)');
    root.style.setProperty('--border','rgba(0,0,0,.1)');
    root.style.setProperty('--border2','rgba(0,0,0,.22)');
    root.style.setProperty('--text','#1a1208');
    root.style.setProperty('--text2','rgba(30,20,5,.65)');
    root.style.setProperty('--muted','rgba(30,20,5,.45)');
    root.style.setProperty('--pos','#0f7748');
    root.style.setProperty('--neg','#c0392b');
  }
  const icon = document.getElementById('themeIcon');
  const label = document.getElementById('themeLabel');
  if(!icon || !label) return;
  if(mode==='dark'){   icon.outerHTML=MOON_SVG.replace('<svg','<svg id="themeIcon"'); label.textContent='Night'; }
  else if(mode==='light'){ icon.outerHTML=SUN_SVG.replace('<svg','<svg id="themeIcon"'); label.textContent='Day'; }
  else {                   icon.outerHTML=SYS_SVG.replace('<svg','<svg id="themeIcon"'); label.textContent='System'; }
}

function setTheme(mode, btn){
  _themeMode = mode;
  localStorage.setItem('prvaaha-combo-theme', mode);
  applyTheme(mode);
  document.querySelectorAll('.theme-opt').forEach(o=>o.classList.toggle('active', o.dataset.mode===mode));
  closeThemeMenu();
}

function toggleThemeMenu(){
  document.getElementById('themeMenu').classList.toggle('open');
}
function closeThemeMenu(){
  document.getElementById('themeMenu').classList.remove('open');
}
document.addEventListener('click', e=>{
  const tt = document.getElementById('themeToggle');
  if(tt && !tt.contains(e.target)) closeThemeMenu();
});

// IST CLOCK
// ══════════════════════════════════════════════
function updateClock(){
  const now = new Date();
  const ist = new Date(now.toLocaleString('en-US',{timeZone:'Asia/Kolkata'}));
  const h = ist.getHours().toString().padStart(2,'0');
  const m = ist.getMinutes().toString().padStart(2,'0');
  const s = ist.getSeconds().toString().padStart(2,'0');
  const timeStr = `${h}:${m}:${s} IST`;
  const clockEl = document.getElementById('istClock');
  const dispEl  = document.getElementById('istDisp');
  if(clockEl) clockEl.textContent = timeStr;
  if(dispEl)  dispEl.textContent  = `${h}:${m}`;

  // Update market status
  const dow = ist.getDay();
  const mins = ist.getHours()*60 + ist.getMinutes();
  const isWeekday = dow>=1 && dow<=5;
  const isOpen = isWeekday && mins>=555 && mins<930; // 9:15–15:30 IST
  const statusEl = document.getElementById('mktStatus');
  if(statusEl){
    statusEl.textContent = isOpen ? '● NSE & BSE: Open' : '● NSE & BSE: Closed';
    statusEl.style.color = isOpen ? '#6ee7a0' : 'rgba(245,240,224,.4)';
  }
}

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  initData();
  buildTicker();
  applyTheme(_themeMode);
  document.querySelectorAll('.theme-opt').forEach(o=>o.classList.toggle('active', o.dataset.mode===_themeMode));
  window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change', ()=>{
    if(_themeMode==='system') applyTheme('system');
  });
  updateClock();
  setInterval(updateClock, 1000);
  renderNewsPage();
  // Tick market data + refresh ticker every 10 seconds
  setInterval(()=>{ refreshTicker(); }, 10000);
});
