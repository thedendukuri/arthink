<style>
:root{
  --bg:#000000;--surface:#0a0a0a;--surface2:#111111;--surface3:#181818;
  --border:#1c1c1c;--border2:#2a2a2a;
  --text:#e4e1da;--text2:#a09c95;--muted:#5a5650;
  --pos:#22c55e;--neg:#ef4444;--accent:#FF9933;--link:#c084fc;
  --hdr:#FF9933;
  --serif:'Playfair Display',Georgia,serif;
  --mono:'JetBrains Mono','Courier New',monospace;
  --sans:'Inter',-apple-system,sans-serif;
}
[data-theme="light"]{
  --bg:#ffffff;--surface:#ffffff;--surface2:#f5f5f5;--surface3:#eeeeee;
  --border:#e8e8e8;--border2:#d0d0d0;
  --text:#0a0908;--text2:#4a4740;--muted:#78746c;
  --pos:#166534;--neg:#991b1b;--accent:#c5560a;--link:#7e22ce;
  --hdr:#FF9933;
}
@media(prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#ffffff;--surface:#ffffff;--surface2:#f5f5f5;--surface3:#eeeeee;
    --border:#e8e8e8;--border2:#d0d0d0;
    --text:#0a0908;--text2:#4a4740;--muted:#78746c;
    --pos:#166534;--neg:#991b1b;--accent:#c5560a;--link:#7e22ce;
    --hdr:#FF9933;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit}
.pos{color:var(--pos)}.neg{color:var(--neg)}

/* Header */
.hdr{background:var(--hdr);border-bottom:3px solid #138808;height:52px;display:flex;align-items:center;padding:0 24px;gap:0;position:sticky;top:0;z-index:500}
.logo{display:flex;align-items:center;gap:10px;padding-right:20px;border-right:1px solid rgba(0,0,0,.18);flex-shrink:0;cursor:pointer}
.logo-flag{width:24px;height:24px;border-radius:3px;overflow:hidden;display:flex;flex-direction:column;flex-shrink:0}
.lf1{flex:1;background:#FF9933}.lf2{flex:1;background:#fff;display:flex;align-items:center;justify-content:center;font-size:6px;font-weight:900;color:#000080}.lf3{flex:1;background:#138808}
.logo-name{font-family:var(--serif);font-size:18px;font-weight:700;color:#3d1a00;white-space:nowrap;font-style:italic}
.logo-name em{color:#138808;font-style:italic}.logo-dot{color:#138808}
.hdr-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.theme-btn{background:none;border:1px solid rgba(0,0,0,.2);width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:rgba(0,0,0,.55);font-size:13px}
.theme-btn:hover{border-color:#138808;color:#138808}

/* Symbol Bar */
.sym-bar{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:55px;z-index:400}
.sym-bar-inner{max-width:1400px;margin:0 auto;padding:14px 24px;display:flex;align-items:flex-start;gap:28px;flex-wrap:wrap}
.breadcrumb{font-family:var(--mono);font-size:10px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-bottom:6px;letter-spacing:.3px}
.breadcrumb a{cursor:pointer}.breadcrumb a:hover{color:var(--accent)}
.breadcrumb .sep{color:var(--border2)}
.sym-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sym-tkr{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.3px}
.sym-co{font-size:14px;color:var(--text2);font-weight:500}
.sym-exch{font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--surface2);padding:2px 6px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;align-self:center}
.sym-price-block{text-align:right;margin-left:auto}
.sym-price{font-family:var(--mono);font-size:32px;font-weight:700;letter-spacing:-1px;line-height:1}
.sym-change{font-family:var(--mono);font-size:14px;font-weight:600;margin-top:4px}
.sym-time{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px}

/* KPI Strip */
.kpi-strip{background:var(--surface2);border-bottom:1px solid var(--border)}
.kpi-inner{max-width:1400px;margin:0 auto;padding:0 24px;display:flex;gap:0;overflow-x:auto}
.kpi{padding:10px 24px 10px 0;min-width:120px;flex-shrink:0;border-right:1px solid var(--border)}
.kpi:last-child{border-right:none}
.kpi-k{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin-bottom:4px}
.kpi-v{font-family:var(--mono);font-size:13px;font-weight:700}

/* Layout */
.page{max-width:1400px;margin:0 auto;padding:24px;display:grid;grid-template-columns:1fr 320px;gap:24px}
@media(max-width:900px){.page{grid-template-columns:1fr;padding:16px}}
.main{}
.sidebar{}

/* Chart */
.chart-card{background:var(--surface);border:1px solid var(--border);margin-bottom:20px}
.chart-hdr{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.chart-title{font-size:12px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--muted)}
.period-tabs{display:flex;gap:2px;margin-left:auto}
.p-btn{background:none;border:1px solid var(--border);color:var(--muted);font-family:var(--mono);font-size:10px;font-weight:600;padding:3px 8px;letter-spacing:.3px;transition:all .15s}
.p-btn:hover,.p-btn.on{background:var(--accent);border-color:var(--accent);color:#000}
.type-tabs{display:flex;gap:2px}
.t-btn{background:none;border:1px solid var(--border);color:var(--muted);font-size:11px;padding:3px 8px;transition:all .15s}
.t-btn.on{background:var(--surface3);border-color:var(--border2);color:var(--text)}
#chartWrap{height:380px;position:relative}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);margin-bottom:16px}
.card-hdr{padding:12px 16px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
.card-body{padding:16px}

/* Stats grid */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border)}
.stat-cell{background:var(--surface);padding:12px 14px}
.stat-k{font-size:10px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;margin-bottom:4px}
.stat-v{font-family:var(--mono);font-size:13px;font-weight:700}

/* Constituents table */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
.tbl th.tr,.tbl td.tr{text-align:right}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--border)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--surface2)}
.tbl tr{cursor:pointer;transition:background .1s}
.weight-bar{display:flex;align-items:center;gap:6px}
.weight-fill{height:3px;background:var(--accent);border-radius:2px;min-width:2px}

/* About */
.about-text{font-size:13px;line-height:1.7;color:var(--text2)}
.about-text p{margin-bottom:12px}
.about-text p:last-child{margin-bottom:0}

/* Sidebar widgets */
.sb-card{background:var(--surface);border:1px solid var(--border);margin-bottom:14px}
.sb-card-hdr{padding:10px 14px;border-bottom:1px solid var(--border);font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.sb-card-body{padding:0}
.sb-row{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer;transition:background .1s}
.sb-row:last-child{border-bottom:none}
.sb-row:hover{background:var(--surface2)}
.sb-sym{font-family:var(--mono);font-weight:700;font-size:11px}
.sb-name{color:var(--text2);font-size:11px}
.sb-pct{font-family:var(--mono);font-size:11px;font-weight:700}

/* Tab bar */
.tab-bar{display:flex;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab-btn{background:none;border:none;border-bottom:2px solid transparent;padding:10px 16px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.3px;margin-bottom:-1px;transition:all .15s}
.tab-btn.on{color:var(--text);border-bottom-color:var(--accent)}
.tab-btn:hover{color:var(--text)}
.tab-pane{display:none}.tab-pane.on{display:block}
</style>
</head>

</div>

// ── Page state ──────────────────────────────────────────────
const rawSym = decodeURIComponent(location.pathname.split('/index/')[1]||'');
const SYM = rawSym || '^NSEI';
const meta = INDEX_META[SYM] || {
  shortName:SYM, fullName:SYM, exch:'—', region:'—',
  color:'#FF9933', currency:'', isIndia:false,
  about:'<p>Detailed information for this index is not yet available.</p>',
  constituents:[], peers:[],
};

const PERIODS=['1D','5D','1M','3M','1Y'];
let _period='1M', _chartType='line', _chartSeries=null, _chart=null;
let _liveTimer=null;

// ── On load ─────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',async()=>{
  document.title=`prvaaha. — ${meta.fullName}`;
  renderHeader();
  renderKPI({});
  renderPeriodTabs();
  renderRelated();
  renderAbout();
  buildChart();
  const q=await fetchQuote();
  renderHeader(q);
  renderKPI(q);
  startLivePulse();
});

function renderHeader(q={}){
  document.getElementById('symTkr').textContent=meta.shortName;
  document.getElementById('symName').textContent=meta.fullName;
  document.getElementById('symExch').textContent=meta.exch+' · '+meta.region;
  const price=q.regularMarketPrice;
  const chg=q.regularMarketChange;
  const pct=q.regularMarketChangePercent;
  const priceEl=document.getElementById('symPrice');
  const chgEl=document.getElementById('symChange');
  if(price!=null){
    priceEl.textContent=(meta.currency||'')+(meta.isIndia?fmt(price):fmt2(price));
    priceEl.style.color=pct>=0?'var(--pos)':'var(--neg)';
    chgEl.textContent=`${sgn(chg)}${meta.isIndia?fmt(chg,2):fmt2(chg,2)} (${sgn(pct)}${fmt2(pct,2)}%)`;
    chgEl.className='sym-change '+(pct>=0?'pos':'neg');
    const t=q.regularMarketTime;
    if(t) document.getElementById('symTime').textContent=
      new Date(t*1000).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',timeZoneName:'short'});
  } else {
    priceEl.textContent='—';
    chgEl.textContent='—';
  }
}

function renderKPI(q){
  const c=meta.currency||'';
  const f=v=>v!=null?(c+(meta.isIndia?fmt(v,2):fmt2(v,2))):'—';
  const items=[
    {k:'Open',        v:f(q.regularMarketOpen)},
    {k:'Day High',    v:f(q.regularMarketDayHigh)},
    {k:'Day Low',     v:f(q.regularMarketDayLow)},
    {k:'Prev Close',  v:f(q.regularMarketPreviousClose)},
    {k:'52W High',    v:f(q.fiftyTwoWeekHigh)},
    {k:'52W Low',     v:f(q.fiftyTwoWeekLow)},
    {k:'Volume',      v:fmtVol(q.regularMarketVolume)},
  ];
  document.getElementById('kpiStrip').innerHTML=items.map(x=>
    `<div class="kpi"><div class="kpi-k">${x.k}</div><div class="kpi-v">${x.v}</div></div>`
  ).join('');
}

function renderPeriodTabs(){
  document.getElementById('periodTabs').innerHTML=PERIODS.map(p=>
    `<button class="p-btn${p===_period?' on':''}" onclick="setPeriod('${p}',this)">${p}</button>`
  ).join('');
}

function setPeriod(p,btn){
  _period=p;
  document.querySelectorAll('.p-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  buildChart();
}

function setChartType(t,btn){
  _chartType=t;
  document.querySelectorAll('.t-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  buildChart();
}

function switchTab(name,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('tab-'+name).classList.add('on');
}

async function fetchQuote(){
  try{
    const r=await fetch(`/api/quote?syms=${encodeURIComponent(SYM)}`,{signal:AbortSignal.timeout(8000)});
    if(!r.ok) return {};
    const j=await r.json();
    return j?.quoteResponse?.result?.[0]||{};
  }catch{return{};}
}

async function buildChart(){
  const wrap=document.getElementById('chartWrap');
  wrap.innerHTML='';
  if(_chart){try{_chart.remove();}catch{} _chart=null;}

  const isDark=document.documentElement.getAttribute('data-theme')!=='light';
  const color=meta.color||'#FF9933';

  _chart=LightweightCharts.createChart(wrap,{
    width:wrap.clientWidth,
    height:380,
    layout:{background:{type:'Solid',color:'transparent'},textColor:isDark?'#a09c95':'#4a4740'},
    grid:{vertLines:{color:isDark?'#1c1c1c':'#e8e8e8'},horzLines:{color:isDark?'#1c1c1c':'#e8e8e8'}},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
    rightPriceScale:{borderColor:isDark?'#1c1c1c':'#e8e8e8'},
    timeScale:{borderColor:isDark?'#1c1c1c':'#e8e8e8',timeVisible:true},
    handleScroll:true,handleScale:true,
    attributionLogo:false,
  });

  const periodMap={
    '1D':{period:'1d',interval:'5m'},'5D':{period:'5d',interval:'15m'},
    '1M':{period:'1mo',interval:'1d'},'3M':{period:'3mo',interval:'1d'},
    '1Y':{period:'1y',interval:'1d'},
  };
  const {period,interval}=periodMap[_period]||{period:'1mo',interval:'1d'};

  wrap.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:380px;color:var(--muted);font-size:12px;font-family:var(--mono)">Loading chart…</div>';
  try{
    const r=await fetch(`/api/chart?sym=${encodeURIComponent(SYM)}&period=${period}&interval=${interval}`,{signal:AbortSignal.timeout(15000)});
    if(!r.ok) throw new Error('chart API error');
    const j=await r.json();
    const bars=j.ohlc||[];
    if(!bars.length) throw new Error('no data');

    wrap.innerHTML='';
    _chart=LightweightCharts.createChart(wrap,{
      width:wrap.clientWidth,height:380,
      layout:{background:{type:'Solid',color:'transparent'},textColor:isDark?'#a09c95':'#4a4740'},
      grid:{vertLines:{color:isDark?'#1c1c1c':'#e8e8e8'},horzLines:{color:isDark?'#1c1c1c':'#e8e8e8'}},
      crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
      rightPriceScale:{borderColor:isDark?'#1c1c1c':'#e8e8e8'},
      timeScale:{borderColor:isDark?'#1c1c1c':'#e8e8e8',timeVisible:_period==='1D'||_period==='5D'},
      handleScroll:true,handleScale:true,
      attributionLogo:false,
    });

    if(_chartType==='candle'){
      _chartSeries=_chart.addCandlestickSeries({
        upColor:'#22c55e',downColor:'#ef4444',borderUpColor:'#22c55e',borderDownColor:'#ef4444',
        wickUpColor:'#22c55e',wickDownColor:'#ef4444',
      });
    } else {
      _chartSeries=_chart.addAreaSeries({
        lineColor:color,topColor:color+'44',bottomColor:color+'00',lineWidth:2,
      });
    }

    const toTime=s=>Math.floor(new Date(s).getTime()/1000);
    const data=bars.map(b=>({
      time:toTime(b.date),open:b.open,high:b.high,low:b.low,close:b.close,value:b.close,
    })).sort((a,b)=>a.time-b.time);

    const dedup=[];const seen=new Set();
    for(const d of data){if(!seen.has(d.time)){seen.add(d.time);dedup.push(d);}}
    _chartSeries.setData(dedup);
    _chart.timeScale().fitContent();

    window.addEventListener('resize',()=>{if(_chart)_chart.applyOptions({width:wrap.clientWidth});});
  }catch(e){
    wrap.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:380px;color:var(--muted);font-size:12px;font-family:var(--mono)">Chart unavailable — ${e.message}</div>`;
  }
}

function renderAbout(){
  document.getElementById('aboutText').innerHTML=meta.about||'<p>No description available.</p>';
}

async function renderConstituents(){
  const body=document.getElementById('constBody');
  const note=document.getElementById('constNote');
  const cs=meta.constituents||[];
  if(!cs.length){
    body.innerHTML='<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--muted)">Constituent data not available for this index.</td></tr>';
    return;
  }
  note.textContent=`${cs.length} shown · weights approximate`;
  const maxW=Math.max(...cs.map(c=>c.w));

  // Render immediately with placeholders
  body.innerHTML=cs.map(c=>`
    <tr onclick="location.href='/stock/${encodeURIComponent(c.sym)}'">
      <td><b style="font-family:var(--mono);font-size:11px">${c.s}</b></td>
      <td style="max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.n}</td>
      <td style="color:var(--muted);font-size:11px">${c.sect}</td>
      <td class="tr">
        <div class="weight-bar" style="justify-content:flex-end">
          <span style="font-family:var(--mono);font-size:11px">${c.w.toFixed(1)}%</span>
          <div class="weight-fill" style="width:${(c.w/maxW*48).toFixed(0)}px"></div>
        </div>
      </td>
      <td class="tr" id="cp-${c.sym.replace(/[^a-z0-9]/gi,'_')}"><span style="color:var(--muted);font-size:11px">—</span></td>
      <td class="tr" id="cc-${c.sym.replace(/[^a-z0-9]/gi,'_')}"><span style="color:var(--muted);font-size:11px">—</span></td>
    </tr>`).join('');

  // Fetch live prices
  const syms=cs.map(c=>c.sym);
  try{
    const r=await fetch(`/api/quote?syms=${encodeURIComponent(syms.join(','))}`,{signal:AbortSignal.timeout(12000)});
    if(!r.ok) return;
    const j=await r.json();
    const qs=j?.quoteResponse?.result||[];
    for(const q of qs){
      const id=q.symbol.replace(/[^a-z0-9]/gi,'_');
      const pEl=document.getElementById('cp-'+id);
      const cEl=document.getElementById('cc-'+id);
      if(!pEl) continue;
      const c=meta.isIndia?meta.currency||'₹':'$';
      if(q.regularMarketPrice!=null)
        pEl.innerHTML=`<b style="font-family:var(--mono);font-size:12px">${c}${meta.isIndia?fmt(q.regularMarketPrice):fmt2(q.regularMarketPrice)}</b>`;
      if(q.regularMarketChangePercent!=null){
        const pct=q.regularMarketChangePercent;
        cEl.innerHTML=`<span style="color:${pct>=0?'var(--pos)':'var(--neg)'};font-weight:700;font-family:var(--mono);font-size:12px">${sgn(pct)}${fmt2(pct)}%</span>`;
      }
    }
  }catch{}
}

function renderRelated(){
  const peers=meta.peers||[];
  const NAMES={
    '^NSEI':'Nifty 50','^BSESN':'Sensex','^NSEBANK':'Bank Nifty',
    '^CNXIT':'Nifty IT','^CNXAUTO':'Nifty Auto','^CNXPHARMA':'Nifty Pharma',
    '^GSPC':'S&P 500','^IXIC':'NASDAQ','^DJI':'Dow Jones','^RUT':'Russell 2000',
    '^FTSE':'FTSE 100','^GDAXI':'DAX','^FCHI':'CAC 40','^STOXX50E':'EURO STOXX 50',
    '^N225':'Nikkei 225','^HSI':'Hang Seng','000001.SS':'Shanghai Comp','^AXJO':'ASX 200',
    '^STI':'Straits Times','^KS11':'KOSPI','^BVSP':'Ibovespa','^MXX':'IPC Mexico',
  };
  document.getElementById('relatedIndices').innerHTML=peers.map(s=>`
    <div class="sb-row" onclick="location.href='/index/${encodeURIComponent(s)}'">
      <div>
        <div class="sb-sym">${s.replace(/^\^/,'')}</div>
        <div class="sb-name">${NAMES[s]||s}</div>
      </div>
      <div class="sb-pct" id="ri-${s.replace(/[^a-z0-9]/gi,'_')}">—</div>
    </div>`).join('');

  // Fetch live pcts for related
  if(peers.length){
    fetch(`/api/quote?syms=${encodeURIComponent(peers.join(','))}`,{signal:AbortSignal.timeout(8000)})
      .then(r=>r.json()).then(j=>{
        for(const q of j?.quoteResponse?.result||[]){
          const el=document.getElementById('ri-'+q.symbol.replace(/[^a-z0-9]/gi,'_'));
          if(!el) continue;
          const p=q.regularMarketChangePercent;
          if(p!=null){el.textContent=`${sgn(p)}${fmt2(p,2)}%`;el.className='sb-pct '+(p>=0?'pos':'neg');}
        }
      }).catch(()=>{});
  }
}

function renderSideStats(q){
  const c=meta.currency||'';
  const f=v=>v!=null?(c+(meta.isIndia?fmt(v,2):fmt2(v,2))):'—';
  const items=[
    {k:'Day Range',v:`${f(q.regularMarketDayLow)} – ${f(q.regularMarketDayHigh)}`},
    {k:'52W Range',v:`${f(q.fiftyTwoWeekLow)} – ${f(q.fiftyTwoWeekHigh)}`},
    {k:'Volume',v:fmtVol(q.regularMarketVolume)},
    {k:'Prev Close',v:f(q.regularMarketPreviousClose)},
    {k:'Open',v:f(q.regularMarketOpen)},
  ];
  document.getElementById('sideStats').innerHTML=items.map(x=>`
    <div class="sb-row" style="cursor:default">
      <span style="color:var(--muted);font-size:11px">${x.k}</span>
      <span style="font-family:var(--mono);font-size:11px;font-weight:600">${x.v}</span>
    </div>`).join('');
}

function startLivePulse(){
  clearInterval(_liveTimer);
  _liveTimer=setInterval(async()=>{
    const q=await fetchQuote();
    renderHeader(q);
    renderSideStats(q);
  },15000);
}

// Kick off constituents render
renderConstituents();
</script>
</body>
</html>
